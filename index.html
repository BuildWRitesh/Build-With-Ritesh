<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Build With Ritesh | Portfolio</title>

<link rel="icon" href="Build With Ritesh.png">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,Arial,sans-serif;
}

body{

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    overflow:hidden;

    background:#08111F;

    background-image:
    radial-gradient(circle at top right,#00B8C655,transparent 35%),
    radial-gradient(circle at bottom left,#00B8C633,transparent 30%);

}

.card{

    width:90%;
    max-width:760px;

    padding:60px;

    text-align:center;

    border-radius:28px;

    background:rgba(12,22,45,.75);

    border:1px solid rgba(0,184,198,.18);

    backdrop-filter:blur(18px);

    box-shadow:
    0 0 45px rgba(0,184,198,.18),
    0 20px 50px rgba(0,0,0,.45);

}

.logo{

    width:120px;

    border-radius:50%;

    border:4px solid #00B8C6;

    box-shadow:0 0 35px rgba(0,184,198,.45);

    margin-bottom:30px;

}

h4{

    color:#00B8C6;

    letter-spacing:3px;

    margin-bottom:12px;

    text-transform:uppercase;

}

h1{

    color:white;

    font-size:52px;

    margin-bottom:18px;

}

span{

    color:#00B8C6;

}

p{

    color:#C7D2E0;

    font-size:18px;

    line-height:1.9;

}

.buttons{

    margin-top:40px;

}

.btn{

    display:inline-block;

    padding:15px 35px;

    margin:10px;

    border-radius:50px;

    text-decoration:none;

    font-weight:bold;

    transition:.35s;

}

.primary{

    background:#00B8C6;

    color:#08111F;

}

.primary:hover{

    transform:translateY(-5px);

    box-shadow:0 0 25px #00B8C6;

}

.secondary{

    border:2px solid #00B8C6;

    color:#00B8C6;

}

.secondary:hover{

    background:#00B8C6;

    color:#08111F;

}

footer{

    margin-top:45px;

    color:#7E8DA3;

    font-size:15px;

}

@media(max-width:700px){

.logo{

width:90px;

}

h1{

font-size:38px;

}

.card{

padding:40px 25px;

}

p{

font-size:16px;

}

}

</style>

</head>

<body>

<div class="card">

<img src="logo.png" class="logo" alt="Build With Ritesh Logo">

<h4>WELCOME TO MY PORTFOLIO</h4>

<h1>Hi, I'm <span>Ritesh Singh</span></h1>

<p>

Full Stack Developer focused on building fast,
modern and scalable web applications.

<br><br>

🚀 My portfolio is currently under development.
Stay tuned for amazing projects and innovative solutions.

</p>

<div class="buttons">

<a href="https://github.com/BuildWRitesh" class="btn primary">
GitHub
</a>

<a href="https://www.linkedin.com/in/buildwithritesh/" class="btn secondary">
LinkedIn
</a>

</div>

<footer>

© 2026 Build With Ritesh • Crafted with ❤️

</footer>

</div>

</body>
</html>
